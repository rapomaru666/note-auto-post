name: RAPOMAN Publish

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'rapoman/post.json'

permissions:
  contents: write

concurrency:
  group: rapoman-publish
  cancel-in-progress: false

jobs:
  audit-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Gate 0 - readability structure
        run: node scripts/validate-rapoman-rendering.js

      - name: Gate 1 - deterministic RAPOMAN rules
        env:
          RAPOMAN_RULES_FILE: rapoman/rules-v2.json
        run: node scripts/validate-rapoman.js

      - name: Gate 2 - independent Gemini audit
        env:
          RAPOMAN_RULES_FILE: rapoman/rules-v2.json
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.1-flash-lite
        run: node scripts/audit-rapoman-gemini.js

      - name: Publish only after all gates pass
        env:
          HATENA_ID: rapomaru666
          HATENA_API_KEY: ${{ secrets.HATENA_API_KEY }}
          HATENA_BLOG_ID: rapomarublog.hatenablog.com
          RAPOMAN_POST_FILE: rapoman/post.json
          RAPOMAN_LEDGER_FILE: rapoman/published.json
        run: node scripts/post-rapoman.js

      - name: Save audit and publish result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapoman-result-${{ github.run_number }}
          path: |
            rapoman/deterministic-audit.json
            rapoman/ai-audit.json
            senki-published-url.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Record published RAPOMAN post
        if: success()
        run: |
          if git diff --quiet -- rapoman/published.json; then
            echo "No publication ledger change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rapoman/published.json
          git commit -m "Record published RAPOMAN post"
          git push
