name: RAPOMAN Shibatsuki Bukken

on:
  push:
    branches: [main]
    paths:
      - 'rapoman/post.json'
      - '.github/workflows/rapoman-shibatsuki-bukken.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rapoman-shibatsuki-bukken
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate readability
        run: node scripts/validate-rapoman-rendering.js
      - name: Validate RAPOMAN rules
        env:
          RAPOMAN_RULES_FILE: rapoman/rules-v2.json
        run: node scripts/validate-rapoman.js
      - name: Publish to RAPOMAN
        env:
          HATENA_ID: rapomaru666
          HATENA_API_KEY: ${{ secrets.HATENA_API_KEY }}
          HATENA_BLOG_ID: rapomarublog.hatenablog.com
          RAPOMAN_POST_FILE: rapoman/post.json
          RAPOMAN_LEDGER_FILE: rapoman/published.json
        run: node scripts/post-rapoman.js
