name: Note Publish

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'post.json'
      - 'scripts/post-note.js'
      - '.github/workflows/note-draft.yml'

jobs:
  publish-note:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Publish note
        env:
          NOTE_STORAGE_STATE: ${{ secrets.NOTE_STORAGE_STATE }}
          HEADLESS: 'false'
        run: xvfb-run -a npm run post

      - name: Save result and debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: note-result-${{ github.run_number }}
          path: |
            note-published.png
            published-url.txt
            note-debug.png
            note-debug.html
          if-no-files-found: ignore
          retention-days: 3
