name: Note Draft Upload

on:
  workflow_dispatch:

jobs:
  upload-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Upload note draft
        env:
          NOTE_STORAGE_STATE: ${{ secrets.NOTE_STORAGE_STATE }}
          HEADLESS: 'false'
        run: xvfb-run -a npm run post

      - name: Save debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: note-debug-${{ github.run_number }}
          path: |
            note-debug.png
            note-debug.html
          if-no-files-found: ignore
          retention-days: 3
