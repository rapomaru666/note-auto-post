name: RAPOMAN Format Repair

on:
  push:
    branches:
      - main
    paths:
      - 'rapoman/format-repair-trigger.txt'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate readability structure
        run: node scripts/validate-rapoman-rendering.js
      - name: Re-render and update existing Hatena article
        env:
          HATENA_ID: rapomaru666
          HATENA_API_KEY: ${{ secrets.HATENA_API_KEY }}
          HATENA_BLOG_ID: rapomarublog.hatenablog.com
          RAPOMAN_POST_FILE: rapoman/post.json
          RAPOMAN_LEDGER_FILE: rapoman/published.json
        run: node scripts/post-rapoman.js
      - name: Record update
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rapoman/published.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record RAPOMAN formatting repair"
          git push
