name: RAPOMAN Discover Entries

on:
  push:
    branches: [main]
    paths:
      - 'scripts/discover-rapoman-entries.js'
      - '.github/workflows/rapoman-discover.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Discover all RAPOMAN entries
        env:
          HATENA_ID: rapomaru666
          HATENA_API_KEY: ${{ secrets.HATENA_API_KEY }}
          HATENA_BLOG_ID: rapomarublog.hatenablog.com
        run: node scripts/discover-rapoman-entries.js
      - name: Save discovery result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rapoman/discovered-entries.json rapoman/discovered-summary.json rapoman/legacy-source
          git commit -m "Record RAPOMAN discovered entries" || exit 0
          git push
